<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="魔導おみくじ">
<meta name="format-detection" content="telephone=no">
<title>魔導おみくじ｜Ceria fi Ixtigna</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="aether" aria-hidden="true"></div>

<header class="masthead">
  <p class="brand">Ceria fi Ixtigna</p>
  <h1 class="title">魔導おみくじ</h1>
</header>

<main class="stage">

  <!-- 待機画面 -->
  <section id="view-idle" class="view is-active">
    <button id="draw-btn" class="draw-btn" type="button">
      <span class="draw-btn__ring" aria-hidden="true"></span>
      <span class="draw-btn__glyph" aria-hidden="true">✦</span>
      <span class="draw-btn__label">おみくじを引く</span>
    </button>
    <p class="hint">刻印盤に触れてください</p>
  </section>

  <!-- 抽選演出 -->
  <section id="view-drawing" class="view">
    <div class="sigil" aria-hidden="true">
      <svg viewBox="0 0 200 200" class="sigil__svg">
        <circle class="ring ring--slow" cx="100" cy="100" r="92"/>
        <circle class="ring ring--fast" cx="100" cy="100" r="74"/>
        <circle class="ring ring--slow-rev" cx="100" cy="100" r="56"/>
        <polygon class="star star--a" points="100,26 164,137 36,137"/>
        <polygon class="star star--b" points="100,174 36,63 164,63"/>
        <circle class="core" cx="100" cy="100" r="14"/>
      </svg>
      <div class="sigil__spark"></div>
    </div>
    <p id="drawing-text" class="drawing-text">精霊に伺いを立てています</p>
  </section>

  <!-- 結果 -->
  <section id="view-result" class="view">
    <p class="result__lead">刻印が下りました</p>
    <p id="result-label" class="result__label"></p>
    <p class="result__note">プリンターから出てくる<br>おみくじをお受け取りください</p>
    <div id="preview" class="preview" hidden></div>
  </section>

  <!-- エラー -->
  <section id="view-error" class="view">
    <p class="error__title">おみくじを刷れませんでした</p>
    <p id="error-detail" class="error__detail"></p>
    <button id="error-back" class="ghost-btn" type="button">戻る</button>
  </section>

</main>

<footer class="footerbar">
  <span id="status-line" class="status-line"></span>
</footer>

<!-- 設定パネルを開く隠しボタン（1.5秒長押し） -->
<button id="settings-toggle" class="settings-toggle" type="button" aria-label="設定を開く"></button>

<div id="settings" class="settings" hidden>
  <div class="settings__panel" role="dialog" aria-label="設定">
    <h2>設定</h2>

    <label class="field">
      <span>印刷方式</span>
      <select id="set-backend">
        <option value="mock">モック（印刷しない・動作確認用）</option>
        <option value="sdk">ePOS SDK（推奨）</option>
        <option value="xml">ePOS-Print XML 直接送信</option>
      </select>
    </label>

    <label class="field">
      <span>プリンターのIPアドレス</span>
      <input id="set-host" type="text" inputmode="decimal" autocomplete="off" placeholder="192.168.0.100">
    </label>

    <div class="field-row">
      <label class="field">
        <span>SDKポート</span>
        <input id="set-sdk-port" type="number" inputmode="numeric">
      </label>
      <label class="field">
        <span>XMLポート</span>
        <input id="set-xml-port" type="number" inputmode="numeric">
      </label>
    </div>

    <label class="field field--check">
      <input id="set-invert" type="checkbox">
      <span>白黒を反転して印刷する</span>
    </label>

    <p id="settings-info" class="settings__info"></p>

    <div class="settings__actions">
      <button id="set-test" class="ghost-btn" type="button">テスト印刷</button>
      <button id="set-reset-bag" class="ghost-btn" type="button">抽選をリセット</button>
      <button id="set-save" class="primary-btn" type="button">保存して再読み込み</button>
      <button id="set-close" class="ghost-btn" type="button">閉じる</button>
    </div>
  </div>
</div>

<!--
  実機で印刷する（backend: 'sdk'）場合は、Epson ePOS SDK for JavaScript に含まれる
  epos-2.js を omikuji/js/ に置いて、次の行のコメントを外してください。
-->
<!-- <script src="js/epos-2.js"></script> -->

<script src="js/config.js"></script>
<script src="js/raster.js"></script>
<script src="js/printer.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
